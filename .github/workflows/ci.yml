name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint pipeline
        run: ruff check src/pipeline
      - name: Compile check
        run: python -m compileall -q src/pipeline

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: src/serving/recsys-service/pom.xml
      - name: Compile serving API
        run: mvn -B -q -f src/serving/recsys-service/pom.xml compile
