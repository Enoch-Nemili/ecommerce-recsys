server.port=8080

redis.host=localhost
redis.port=6379

# Path to the exported ONNX model. Override with the RANKER_MODEL_PATH environment variable;
# the default assumes you run from src/serving/recsys-service.
ranker.model.path=${RANKER_MODEL_PATH:../../../data/processed/ranker_model.onnx}
elasticsearch.host=http://localhost:9200
elasticsearch.index=items
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
